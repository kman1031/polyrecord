[project]
name = "polyrecord"
version = "0.1.0"
description = "Polymarket + Binance data recorder for hourly crypto up/down markets"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
fast = [
    "uvloop>=0.19; sys_platform != 'win32'",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
polyrecord = "recorder:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
